<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320"><style>
.bob{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.rocking{animation:rocking 2s ease-in-out infinite;transform-origin:160px 290px}
@keyframes rocking{25%{transform:rotate(8deg)}75%{transform:rotate(-8deg)}}
.blink{animation:blink 3s step-end infinite}
@keyframes blink{0%,91%,96%,100%{opacity:1}92%,95%{opacity:0}}
.glowp{animation:glowp 1.3s ease-in-out infinite}
@keyframes glowp{50%{opacity:.3}}
.wag{animation:wag 1.5s ease-in-out infinite}
@keyframes wag{50%{transform:rotate(12deg)}}
.rise{animation:rise 2.6s linear infinite}
@keyframes rise{to{transform:translateY(-80px);opacity:0}}
.bob{animation-duration:3.4s}.rocking{animation-duration:3.6s}.wag{animation-duration:3s}svg>g{transform:translateY(6px)}.drop{animation:drop 2.6s ease-in-out infinite}@keyframes drop{0%,100%{transform:translateY(0);opacity:.9}50%{transform:translateY(6px);opacity:.5}}</style><ellipse cx="160" cy="298" rx="80" ry="14" fill="#1a1a1a" opacity=".12"/><g class="bob"><path d="M138 66 Q146 12 192 16 Q172 38 182 62 Z" fill="#1971c2" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M236 226 Q282 210 292 178 Q296 226 262 252 Z" fill="#1971c2" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="160" cy="178" rx="82" ry="114" fill="#4dabf7" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M84 190 L44 172 L74 214 Z" fill="#4dabf7" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M236 190 L276 172 L246 214 Z" fill="#4dabf7" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="160" cy="222" rx="50" ry="66" fill="#fff" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M112 96 L122 108 M104 112 L114 124 M96 130 L106 142" stroke="#1971c2" stroke-width="5" stroke-linecap="round" fill="none"/><g><path d="M111 110 Q122 123 133 110" fill="none" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/><path d="M187 110 Q198 123 209 110" fill="none" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/><path d="M113 127 L131 127" stroke="#1a1a1a" stroke-width="3" opacity=".45" stroke-linecap="round"/><path d="M189 127 L207 127" stroke="#1a1a1a" stroke-width="3" opacity=".45" stroke-linecap="round"/></g><path d="M120 152 Q160 180 200 152" fill="none" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M134 158 L142 172 L150 160 Z" fill="#fff" stroke="#1a1a1a" stroke-width="3"/><path d="M186 158 L178