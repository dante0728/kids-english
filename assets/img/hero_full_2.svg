<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 460"><style>
.bob{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.hover{animation:hover 1.4s ease-in-out infinite}
@keyframes hover{50%{transform:translateY(-16px)}}
.cape{animation:flutter 2.2s ease-in-out infinite;transform-origin:160px 215px}
@keyframes flutter{50%{transform:skewX(7deg) scaleX(1.06)}}
.jet{animation:flick .28s infinite alternate;transform-origin:center bottom}
@keyframes flick{to{opacity:.45;transform:scaleY(.6)}}
.flex{animation:flex 1.2s ease-in-out infinite;transform-origin:160px 250px}
@keyframes flex{50%{transform:rotate(3deg) scale(1.04)}}
.webline{animation:webpulse 1.6s infinite}
@keyframes webpulse{50%{opacity:.35}}
.shield-arm{animation:shieldup 2s ease-in-out infinite;transform-origin:118px 250px}
@keyframes shieldup{50%{transform:rotate(-7deg)}}
.spin{animation:spin 3s linear infinite;transform-origin:var(--o)}
@keyframes spin{to{transform:rotate(360deg)}}
.zapflick{animation:zapflick .5s infinite alternate}
@keyframes zapflick{to{opacity:.2}}
.shrink{animation:shrink 2.4s ease-in-out infinite;transform-origin:160px 430px}
@keyframes shrink{50%{transform:scale(.72)}}
.sway{animation:sway 2.6s ease-in-out infinite;transform-origin:160px 300px}
@keyframes sway{50%{transform:skewX(-5deg)}}
.shimmer{animation:shimmer 1s infinite alternate}
@keyframes shimmer{to{opacity:.35}}
.speed{animation:speed .5s infinite}
@keyframes speed{50%{opacity:.15;transform:translateX(-14px)}}
.rise{animation:rise 2.4s linear infinite}
@keyframes rise{to{transform:translateY(-70px);opacity:0}}
.glowp{animation:glowp 1.3s ease-in-out infinite}
@keyframes glowp{50%{transform:scale(1.25);opacity:.6}}
.wag{animation:wag 1.5s ease-in-out infinite;transform-origin:220px 340px}
@keyframes wag{50%{transform:rotate(14deg)}}
</style><g class="bob"><rect x="124" y="340" width="30" height="80" rx="15" fill="#0a3161" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="166" y="340" width="30" height="80" rx="15" fill="#0a3161" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="120" y="400" width="38" height="22" rx="11" fill="#c8102e" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="162" y="400" width="38" height="22" rx="11" fill="#c8102e" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="214" y="238" width="30" height="86" rx="15" fill="#0a3161" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-18 229 245)"/><path d="M118 226 Q160 214 202 226 L208 320 Q160 340 112 320 Z" fill="#0a3161" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M160 240 L166 256 L182 256 L169 266 L174 282 L160 272 L146 282 L151 266 L138 256 L154 256 Z" fill="#fff" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M118 296 L202 296 L208 320 Q160 340 112 320 Z" fill="#c8102e" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g class="shield-arm"><rect x="76" y="238" width="30" height="86" rx="15" fill="#0a3161" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" transform="rotate(24 91 245)"/><circle cx="66" cy="316" r="44" fill="#c8102e" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="66" cy="316" r="30" fill="#fff" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="66" cy="316" r="17" fill="#0a3161" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M66 306 L69 313 L77 313 L71 318 L73 326 L66 321 L59 326 L61 318 L55 313 L63 313 Z" fill="#fff"/></g><circle cx="160" cy="128" r="80" fill="#0a3161" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M92 118 L118 108 L118 130 Z" fill="#fff" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M228 118 L202 108 L202 130 Z" fill="#fff" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="134" cy="132" r="10" fill="#fff"/><circle cx="186" cy="132" r="10" fill="#fff"/><text x="160" y="106" font-family="Arial Black,Arial" font-size="50" font-weight="900" fill="#fff" text-anchor="middle">A</text><path d="M136 168 Q160 184 184 168" fill="none" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g></svg>