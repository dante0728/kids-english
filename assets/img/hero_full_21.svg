<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 460"><style>
.bob{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.hover{animation:hover 1.4s ease-in-out infinite}
@keyframes hover{50%{transform:translateY(-16px)}}
.cape{animation:flutter 2.2s ease-in-out infinite;transform-origin:160px 215px}
@keyframes flutter{50%{transform:skewX(7deg) scaleX(1.06)}}
.jet{animation:flick .28s infinite alternate;transform-origin:center bottom}
@keyframes flick{to{opacity:.45;transform:scaleY(.6)}}
.flex{animation:flex 1.2s ease-in-out infinite;transform-origin:160px 250px}
@keyframes flex{50%{transform:rotate(3deg) scale(1.04)}}
.webline{animation:webpulse 1.6s infinite}
@keyframes webpulse{50%{opacity:.35}}
.shield-arm{animation:shieldup 2s ease-in-out infinite;transform-origin:118px 250px}
@keyframes shieldup{50%{transform:rotate(-7deg)}}
.spin{animation:spin 3s linear infinite;transform-origin:var(--o)}
@keyframes spin{to{transform:rotate(360deg)}}
.zapflick{animation:zapflick .5s infinite alternate}
@keyframes zapflick{to{opacity:.2}}
.shrink{animation:shrink 2.4s ease-in-out infinite;transform-origin:160px 430px}
@keyframes shrink{50%{transform:scale(.72)}}
.sway{animation:sway 2.6s ease-in-out infinite;transform-origin:160px 300px}
@keyframes sway{50%{transform:skewX(-5deg)}}
.shimmer{animation:shimmer 1s infinite alternate}
@keyframes shimmer{to{opacity:.35}}
.speed{animation:speed .5s infinite}
@keyframes speed{50%{opacity:.15;transform:translateX(-14px)}}
.rise{animation:rise 2.4s linear infinite}
@keyframes rise{to{transform:translateY(-70px);opacity:0}}
.glowp{animation:glowp 1.3s ease-in-out infinite}
@keyframes glowp{50%{transform:scale(1.25);opacity:.6}}
.wag{animation:wag 1.5s ease-in-out infinite;transform-origin:220px 340px}
@keyframes wag{50%{transform:rotate(14deg)}}
</style><g class="hover"><path class="cape" d="M118 228 Q100 320 84 408 Q160 386 236 408 Q220 320 202 228 Z" fill="#2a7d4f" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="124" y="340" width="30" height="80" rx="15" fill="#c8102e" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="166" y="340" width="30" height="80" rx="15" fill="#c8102e" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="120" y="400" width="38" height="22" rx="11" fill="#f2a900" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="162" y="400" width="38" height="22" rx="11" fill="#f2a900" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="76" y="238" width="30" height="86" rx="15" fill="#c8102e" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" transform="rotate(18 91 245)"/><rect x="214" y="238" width="30" height="86" rx="15" fill="#c8102e" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-18 229 245)"/><path d="M118 226 Q160 214 202 226 L208 320 Q160 340 112 320 Z" fill="#c8102e" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M118 226 Q160 214 202 226 L206 264 Q160 278 114 264 Z" fill="#f2a900" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="160" y1="278" x2="160" y2="322" stroke="#f2a900" stroke-width="6"/><circle cx="160" cy="128" r="80" fill="#c8102e" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M84 122 Q92 58 160 54 Q228 58 236 122 Q218 88 160 84 Q102 88 84 122 Z" fill="#f2a900" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M78 134 L110 114 L110 154 Z" fill="#f2a900" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M242 134 L210 114 L210 154 Z" fill="#f2a900" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle class="glowp" cx="160" cy="96" r="17" fill="#ffd60a"/><circle cx="160" cy="96" r="9" fill="#fff8c4" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="134" cy="146" r="8" fill="#fff"/><circle cx="186" cy="146" r="8" fill="#fff"/><path d="M136 180 Q160 196 184 180" fill="none" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g></svg>