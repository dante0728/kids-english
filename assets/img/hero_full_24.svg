inecap="round" stroke-linejoin="round"/><path d="M100 132 Q160 112 220 132 L218 156 Q160 136 102 156 Z" fill="#c8102e" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="132" cy="138" r="8" fill="#ff8fa3"/><circle cx="188" cy="138" r="8" fill="#ff8fa3"/><path d="M136 186 Q160 202 184 186" fill="none" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g></svg>