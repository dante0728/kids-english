<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 460"><style>
.bob{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.hover{animation:hover 1.4s ease-in-out infinite}
@keyframes hover{50%{transform:translateY(-16px)}}
.cape{animation:flutter 2.2s ease-in-out infinite;transform-origin:160px 215px}
@keyframes flutter{50%{transform:skewX(7deg) scaleX(1.06)}}
.jet{animation:flick .28s infinite alternate;transform-origin:center bottom}
@keyframes flick{to{opacity:.45;transform:scaleY(.6)}}
.flex{animation:flex 1.2s ease-in-out infinite;transform-origin:160px 250px}
@keyframes flex{50%{transform:rotate(3deg) scale(1.04)}}
.webline{animation:webpulse 1.6s infinite}
@keyframes webpulse{50%{opacity:.35}}
.shield-arm{animation:shieldup 2s ease-in-out infinite;transform-origin:118px 250px}
@keyframes shieldup{50%{transform:rotate(-7deg)}}
.spin{animation:spin 3s linear infinite;transform-origin:var(--o)}
@keyframes spin{to{transform:rotate(360deg)}}
.zapflick{animation:zapflick .5s infinite alternate}
@keyframes zapflick{to{opacity:.2}}
.shrink{animation:shrink 2.4s ease-in-out infinite;transform-origin:160px 430px}
@keyframes shrink{50%{transform:scale(.72)}}
.sway{animation:sway 2.6s ease-in-out infinite;transform-origin:160px 300px}
@keyframes sway{50%{transform:skewX(-5deg)}}
.shimmer{animation:shimmer 1s infinite alternate}
@keyframes shimmer{to{opacity:.35}}
.speed{animation:speed .5s infinite}
@keyframes speed{50%{opacity:.15;transform:translateX(-14px)}}
.rise{animation:rise 2.4s linear infinite}
@keyframes rise{to{transform:translateY(-70px);opacity:0}}
.glowp{animation:glowp 1.3s ease-in-out infinite}
@keyframes glowp{50%{transform:scale(1.25);opacity:.6}}
.wag{animation:wag 1.5s ease-in-out infinite;transform-origin:220px 340px}
@keyframes wag{50%{transform:rotate(14deg)}}
</style><g class="bob"><g class="sway"><path d="M120 60 Q112 28 132 20 M150 56 Q150 24 170 18 M196 62 Q200 30 220 28" fill="none" stroke="#5a3d2b" stroke-width="10" stroke-linecap="round"/><ellipse cx="128" cy="26" rx="16" ry="10" fill="#6a994e" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-30 128 26)"/><ellipse cx="172" cy="20" rx="14" ry="9" fill="#6a994e" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" transform="rotate(15 172 20)"/><ellipse cx="216" cy="30" rx="16" ry="10" fill="#6a994e" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" transform="rotate(25 216 30)"/></g><rect x="122" y="340" width="32" height="82" rx="16" fill="#8b5e3c" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="166" y="340" width="32" height="82" rx="16" fill="#8b5e3c" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="118" y="402" width="42" height="22" rx="11" fill="#5a3d2b" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="160" y="402" width="42" height="22" rx="11" fill="#5a3d2b" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="76" y="238" width="30" height="86" rx="15" fill="#8b5e3c" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" transform="rotate(24 91 245)"/><rect x="214" y="238" width="30" height="86" rx="15" fill="#8b5e3c" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-24 229 245)"/><path d="M112 224 Q160 210 208 224 L212 322 Q160 342 108 322 Z" fill="#8b5e3c" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M132 244 Q140 280 130 310 M188 244 Q180 280 190 310" fill="none" stroke="#5a3d2b" stroke-width="6" stroke-linecap="round"/><path d="M104 80 Q160 54 216 80 Q244 128 234 192 Q224 246 160 254 Q96 246 86 192 Q76 128 104 80 Z" fill="#8b5e3c" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M116 106 Q124 142 112 176 M204 106 Q196 142 208 176" fill="none" stroke="#5a3d2b" stroke-width="6" stroke-linecap="round"/><circle cx="134" cy="160" r="11" fill="#1a1a1a"/><circle cx="186" cy="160" r="11" fill="#1a1a1a"/><path d="M140 206 Q160 218 180 206" fill="none" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g></svg>