<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320"><style>
.bob{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.rocking{animation:rocking 2s ease-in-out infinite;transform-origin:160px 290px}
@keyframes rocking{25%{transform:rotate(8deg)}75%{transform:rotate(-8deg)}}
.blink{animation:blink 3s step-end infinite}
@keyframes blink{0%,91%,96%,100%{opacity:1}92%,95%{opacity:0}}
.glowp{animation:glowp 1.3s ease-in-out infinite}
@keyframes glowp{50%{opacity:.3}}
.wag{animation:wag 1.5s ease-in-out infinite}
@keyframes wag{50%{transform:rotate(12deg)}}
.rise{animation:rise 2.6s linear infinite}
@keyframes rise{to{transform:translateY(-80px);opacity:0}}
.bob{animation-duration:3.4s}.rocking{animation-duration:3.6s}.wag{animation-duration:3s}svg>g{transform:translateY(6px)}.drop{animation:drop 2.6s ease-in-out infinite}@keyframes drop{0%,100%{transform:translateY(0);opacity:.9}50%{transform:translateY(6px);opacity:.5}}</style><ellipse cx="160" cy="298" rx="80" ry="14" fill="#1a1a1a" opacity=".12"/><g class="rise" opacity=".8"><circle cx="52" cy="150" r="9" fill="none" stroke="#7fd8ff" stroke-width="5"/><circle cx="34" cy="196" r="6" fill="none" stroke="#7fd8ff" stroke-width="5"/><circle cx="284" cy="170" r="7" fill="none" stroke="#7fd8ff" stroke-width="5"/></g><g class="bob"><path d="M138 70 Q146 20 190 22 Q172 42 182 66 Z" fill="#1971c2" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M236 226 Q282 210 292 178 Q296 226 262 252 Z" fill="#1971c2" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="160" cy="178" rx="82" ry="114" fill="#4dabf7" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M84 190 L44 172 L74 214 Z" fill="#4dabf7" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M236 190 L276 172 L246 214 Z" fill="#4dabf7" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="62" cy="192" r="9" fill="none" stroke="#f2a900" stroke-width="6"/><circle cx="258" cy="192" r="9" fill="none" stroke="#f2a900" stroke-width="6"/><ellipse cx="160" cy="222" rx="50" ry="66" fill="#fff" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g class="glowp"><path d="M160 190 L160 258 M136 206 Q136 190 148 186 M184 206 Q184 190 172 186 M136 206 L136 216 M184 206 L184 216 M148 250 L172 250" fill="none" stroke="#f2a900" stroke-width="7" stroke-linecap="round"/></g><path d="M116 64 L116 28 L134 48 L152 22 L170 48 L188 28 L188 58" fill="#f2a900" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g><path d="M111 110 Q122 123 133 110" fill="none" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/><path d="M187 110 Q198 123 209 110" fill="none" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/><path d="M113 127 L131 127" stroke="#1a1a1a" stroke-width="3" opacity=".45" stroke-linecap="round"/><path d="M189 127 L207 127" stroke="#1a1a1a" stroke-width="3" opacity=".45" stroke-linecap="round"/></g><path d="M120 152 Q160 180 200 152" fill="none" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M134 158 L142 172 L150 160 Z" fill="#fff" stroke="#1a1a1a" stroke-width="3"/><path d="M186 158 L178 172 L170 160 Z" fill="#fff" stroke="#1a1a1a" stroke-width="3"/></g><g class="drop"><path d="M258 62 Q248 82 258 90 Q270 84 262 62 Z" fill="#7fd8ff" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round"/></g></svg>