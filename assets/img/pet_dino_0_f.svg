<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320"><style>
.bob{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.rocking{animation:rocking 2s ease-in-out infinite;transform-origin:160px 290px}
@keyframes rocking{25%{transform:rotate(8deg)}75%{transform:rotate(-8deg)}}
.blink{animation:blink 3s step-end infinite}
@keyframes blink{0%,91%,96%,100%{opacity:1}92%,95%{opacity:0}}
.glowp{animation:glowp 1.3s ease-in-out infinite}
@keyframes glowp{50%{opacity:.3}}
.wag{animation:wag 1.5s ease-in-out infinite}
@keyframes wag{50%{transform:rotate(12deg)}}
.rise{animation:rise 2.6s linear infinite}
@keyframes rise{to{transform:translateY(-80px);opacity:0}}
.bob{animation-duration:1.1s}.rocking{animation-duration:1.4s}.wag{animation-duration:.9s}.spark{animation:spark 1.6s ease-in-out infinite}@keyframes spark{50%{opacity:.2;transform:scale(.7)}}.drop{animation:drop 2.2s ease-in-out infinite}@keyframes drop{50%{transform:translateY(4px)}}</style><ellipse cx="160" cy="298" rx="80" ry="14" fill="#1a1a1a" opacity=".12"/><g class="rocking"><ellipse cx="160" cy="182" rx="100" ry="108" fill="#ff8c42" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M92 128 Q104 92 138 82" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity=".45"/><circle cx="106" cy="220" r="14" fill="#e8590c" opacity=".55"/><circle cx="216" cy="230" r="11" fill="#e8590c" opacity=".55"/><circle cx="196" cy="102" r="12" fill="#e8590c" opacity=".55"/><path d="M160 74 L150 52 L160 62 L170 48 L178 66" fill="none" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g><path d="M112 174.0 Q124 156 136 174.0" fill="none" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/><path d="M184 174.0 Q196 156 208 174.0" fill="none" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/></g><circle cx="108" cy="200" r="13" fill="#ffb3b3" opacity=".95"/><circle cx="212" cy="200" r="13" fill="#ffb3b3" opacity=".95"/><path d="M136 196 Q160 224 184 196 Z" fill="#7a2b2b" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M149.92 211 Q160 224 170.08 211 Z" fill="#ff8fa3"/></g><g class="spark"><g transform="translate(46,70)"><path d="M0 -13 L4 -4 L13 0 L4 4 L0 13 L-4 4 L-13 0 L-4 -4 Z" fill="#ffd60a" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/></g><g transform="translate(276,92) scale(.8)"><path d="M0 -13 L4 -4 L13 0 L4 4 L0 13 L-4 4 L-13 0 L-4 -4 Z" fill="#ffd60a" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/></g><g transform="translate(40,222) scale(.7)"><path d="M0 -13 L4 -4 L13 0 L4 4 L0 13 L-4 4 L-13 0 L-4 -4 Z" fill="#ffd60a" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/></g></g></svg>