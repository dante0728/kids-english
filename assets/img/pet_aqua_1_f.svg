rm="translate(46,70)"><path d="M0 -13 L4 -4 L13 0 L4 4 L0 13 L-4 4 L-13 0 L-4 -4 Z" fill="#ffd60a" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/></g><g transform="translate(276,92) scale(.8)"><path d="M0 -13 L4 -4 L13 0 L4 4 L0 13 L-4 4 L-13 0 L-4 -4 Z" fill="#ffd60a" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/></g><g transform="translate(40,222) scale(.7)"><path d="M0 -13 L4 -4 L13 0 L4 4 L0 13 L-4 4 L-13 0 L-4 -4 Z" fill="#ffd60a" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/></g></g></svg>