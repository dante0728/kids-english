<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320"><style>
.bob{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.rocking{animation:rocking 2s ease-in-out infinite;transform-origin:160px 290px}
@keyframes rocking{25%{transform:rotate(8deg)}75%{transform:rotate(-8deg)}}
.blink{animation:blink 3s step-end infinite}
@keyframes blink{0%,91%,96%,100%{opacity:1}92%,95%{opacity:0}}
.glowp{animation:glowp 1.3s ease-in-out infinite}
@keyframes glowp{50%{opacity:.3}}
.wag{animation:wag 1.5s ease-in-out infinite}
@keyframes wag{50%{transform:rotate(12deg)}}
.rise{animation:rise 2.6s linear infinite}
@keyframes rise{to{transform:translateY(-80px);opacity:0}}
</style><ellipse cx="160" cy="298" rx="80" ry="14" fill="#1a1a1a" opacity=".12"/><g class="rocking"><ellipse cx="160" cy="182" rx="100" ry="108" fill="#ff8c42" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M92 128 Q104 92 138 82" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity=".45"/><circle cx="106" cy="220" r="14" fill="#e8590c" opacity=".55"/><circle cx="216" cy="230" r="11" fill="#e8590c" opacity=".55"/><circle cx="196" cy="102" r="12" fill="#e8590c" opacity=".55"/><path d="M160 74 L150 52 L160 62 L170 48 L178 66" fill="none" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g class="blink"><circle cx="124" cy="168" r="12" fill="#1a1a1a"/><circle cx="196" cy="168" r="12" fill="#1a1a1a"/><circle cx="127" cy="165" r="4" fill="#fff"/><circle cx="199" cy="165" r="4" fill="#fff"/></g><circle cx="108" cy="200" r="10" fill="#ffb3b3" opacity=".8"/><circle cx="212" cy="200" r="10" fill="#ffb3b3" opacity=".8"/><path d="M136 198 Q160 212 184 198" fill="none" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g></svg>