<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 460"><style>
.bob{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.hover{animation:hover 1.4s ease-in-out infinite}
@keyframes hover{50%{transform:translateY(-16px)}}
.cape{animation:flutter 2.2s ease-in-out infinite;transform-origin:160px 215px}
@keyframes flutter{50%{transform:skewX(7deg) scaleX(1.06)}}
.jet{animation:flick .28s infinite alternate;transform-origin:center bottom}
@keyframes flick{to{opacity:.45;transform:scaleY(.6)}}
.flex{animation:flex 1.2s ease-in-out infinite;transform-origin:160px 250px}
@keyframes flex{50%{transform:rotate(3deg) scale(1.04)}}
.webline{animation:webpulse 1.6s infinite}
@keyframes webpulse{50%{opacity:.35}}
.shield-arm{animation:shieldup 2s ease-in-out infinite;transform-origin:118px 250px}
@keyframes shieldup{50%{transform:rotate(-7deg)}}
.spin{animation:spin 3s linear infinite;transform-origin:var(--o)}
@keyframes spin{to{transform:rotate(360deg)}}
.zapflick{animation:zapflick .5s infinite alternate}
@keyframes zapflick{to{opacity:.2}}
.shrink{animation:shrink 2.4s ease-in-out infinite;transform-origin:160px 430px}
@keyframes shrink{50%{transform:scale(.72)}}
.sway{animation:sway 2.6s ease-in-out infinite;transform-origin:160px 300px}
@keyframes sway{50%{transform:skewX(-5deg)}}
.shimmer{animation:shimmer 1s infinite alternate}
@keyframes shimmer{to{opacity:.35}}
.speed{animation:speed .5s infinite}
@keyframes speed{50%{opacity:.15;transform:translateX(-14px)}}
.rise{animation:rise 2.4s linear infinite}
@keyframes rise{to{transform:translateY(-70px);opacity:0}}
.glowp{animation:glowp 1.3s ease-in-out infinite}
@keyframes glowp{50%{transform:scale(1.25);opacity:.6}}
.wag{animation:wag 1.5s ease-in-out infinite;transform-origin:220px 340px}
@keyframes wag{50%{transform:rotate(14deg)}}
</style><g class="bob"><rect x="124" y="340" width="30" height="80" rx="15" fill="#1f6fd0" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="166" y="340" width="30" height="80" rx="15" fill="#1f6fd0" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="120" y="400" width="38" height="22" rx="11" fill="#c8102e" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="162" y="400" width="38" height="22" rx="11" fill="#c8102e" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="76" y="238" width="30" height="86" rx="15" fill="#1f6fd0" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" transform="rotate(26 91 245)"/><rect x="214" y="238" width="30" height="86" rx="15" fill="#1f6fd0" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-26 229 245)"/><path d="M118 226 Q160 214 202 226 L208 320 Q160 340 112 320 Z" fill="#1f6fd0" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M118 226 Q160 214 202 226 L204 260 Q160 274 116 260 Z" fill="#d7dde3" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M132 274 L124 316 M188 274 L196 316" fill="none" stroke="#c8102e" stroke-width="11" stroke-linecap="round"/><circle cx="160" cy="292" r="16" fill="#e63946" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M130 66 Q94 20 66 6 Q88 44 108 92 Z" fill="#c0c6cf" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M190 66 Q226 20 254 6 Q232 44 212 92 Z" fill="#c0c6cf" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="160" cy="128" rx="64" ry="80" fill="#d7dde3" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M98 122 Q100 54 160 50 Q220 54 222 122 Q200 82 160 82 Q120 82 98 122 Z" fill="#1f6fd0" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M160 82 L160 112" fill="none" stroke="#c8102e" stroke-width="10" stroke-linecap="round"/><path d="M110 144 Q116 168 130 182" fill="none" stroke="#c8102e" stroke-width="10" stroke-linecap="round"/><path d="M210 144 Q204 168 190 182" fill="none" stroke="#c8102e" stroke-width="10" stroke-linecap="round"/><ellipse cx="128" cy="126" rx="26" ry="17" fill="#ffd60a" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-16 128 126)"/><ellipse cx="192" cy="126" rx="26" ry="17" fill="#ffd60a" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" transform="rotate(16 192 126)"/><path d="M146 176 Q160 186 174 176" fill="none" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g></svg>