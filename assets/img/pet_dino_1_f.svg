<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320"><style>
.bob{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.rocking{animation:rocking 2s ease-in-out infinite;transform-origin:160px 290px}
@keyframes rocking{25%{transform:rotate(8deg)}75%{transform:rotate(-8deg)}}
.blink{animation:blink 3s step-end infinite}
@keyframes blink{0%,91%,96%,100%{opacity:1}92%,95%{opacity:0}}
.glowp{animation:glowp 1.3s ease-in-out infinite}
@keyframes glowp{50%{opacity:.3}}
.wag{animation:wag 1.5s ease-in-out infinite}
@keyframes wag{50%{transform:rotate(12deg)}}
.rise{animation:rise 2.6s linear infinite}
@keyframes rise{to{transform:translateY(-80px);opacity:0}}
.bob{animation-duration:1.1s}.rocking{animation-duration:1.4s}.wag{animation-duration:.9s}.spark{animation:spark 1.6s ease-in-out infinite}@keyframes spark{50%{opacity:.2;transform:scale(.7)}}.drop{animation:drop 2.2s ease-in-out infinite}@keyframes drop{50%{transform:translateY(4px)}}</style><ellipse cx="160" cy="298" rx="80" ry="14" fill="#1a1a1a" opacity=".12"/><g class="bob"><path d="M212 246 Q252 240 258 212 Q264 246 234 266 Z" fill="#ff8c42" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="116" y="258" width="42" height="32" rx="16" fill="#ff8c42" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="162" y="258" width="42" height="32" rx="16" fill="#ff8c42" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="160" cy="220" rx="66" ry="60" fill="#ff8c42" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="160" cy="236" rx="38" ry="38" fill="#ffe8c9" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="98" cy="216" rx="15" ry="24" fill="#ff8c42" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" transform="rotate(22 98 216)"/><ellipse cx="222" cy="216" rx="15" ry="24" fill="#ff8c42" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-22 222 216)"/><circle cx="160" cy="112" r="70" fill="#ff8c42" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><g><path d="M121 113.5 Q132 97 143 113.5" fill="none" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/><path d="M177 113.5 Q188 97 199 113.5" fill="none" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/></g><circle cx="148" cy="134" r="3.5" fill="#1a1a1a"/><circle cx="172" cy="134" r="3.5" fill="#1a1a1a"/><circle cx="112" cy="136" r="13" fill="#ffb3b3" opacity=".95"/><circle cx="208" cy="136" r="13" fill="#ffb3b3" opacity=".95"/><path d="M140 146 Q160 174 180 146 Z" fill="#7a2b2b" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M151.6 161 Q160 174 168.4 161 Z" fill="#ff8fa3"/></g><g class="spark"><g transform="translate(46,70)"><path d="M0 -13 L4 -4 L13 0 L4 4 L0 13 L-4 4 L-13 0 L-4 -4 Z" fill="#ffd60a" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/></g><g transform="translate(276,92) scale(.8)"><path d="M0 -13 L4 -4 L13 0 L4 4 L0 13 L-4 4 L-13 0 L-4 -4 Z" fill="#ffd60a" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/></g><g transform="translate(40,222) scale(.7)"><path d="M0 -13 L4 -4 L13 0 L4 4 L0 13 L-4 4 L-13 0 L-4 -4 Z" fill="#ffd60a" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/></g></g></svg>