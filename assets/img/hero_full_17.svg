<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 460"><style>
.bob{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.hover{animation:hover 1.4s ease-in-out infinite}
@keyframes hover{50%{transform:translateY(-16px)}}
.cape{animation:flutter 2.2s ease-in-out infinite;transform-origin:160px 215px}
@keyframes flutter{50%{transform:skewX(7deg) scaleX(1.06)}}
.jet{animation:flick .28s infinite alternate;transform-origin:center bottom}
@keyframes flick{to{opacity:.45;transform:scaleY(.6)}}
.flex{animation:flex 1.2s ease-in-out infinite;transform-origin:160px 250px}
@keyframes flex{50%{transform:rotate(3deg) scale(1.04)}}
.webline{animation:webpulse 1.6s infinite}
@keyframes webpulse{50%{opacity:.35}}
.shield-arm{animation:shieldup 2s ease-in-out infinite;transform-origin:118px 250px}
@keyframes shieldup{50%{transform:rotate(-7deg)}}
.spin{animation:spin 3s linear infinite;transform-origin:var(--o)}
@keyframes spin{to{transform:rotate(360deg)}}
.zapflick{animation:zapflick .5s infinite alternate}
@keyframes zapflick{to{opacity:.2}}
.shrink{animation:shrink 2.4s ease-in-out infinite;transform-origin:160px 430px}
@keyframes shrink{50%{transform:scale(.72)}}
.sway{animation:sway 2.6s ease-in-out infinite;transform-origin:160px 300px}
@keyframes sway{50%{transform:skewX(-5deg)}}
.shimmer{animation:shimmer 1s infinite alternate}
@keyframes shimmer{to{opacity:.35}}
.speed{animation:speed .5s infinite}
@keyframes speed{50%{opacity:.15;transform:translateX(-14px)}}
.rise{animation:rise 2.4s linear infinite}
@keyframes rise{to{transform:translateY(-70px);opacity:0}}
.glowp{animation:glowp 1.3s ease-in-out infinite}
@keyframes glowp{50%{transform:scale(1.25);opacity:.6}}
.wag{animation:wag 1.5s ease-in-out infinite;transform-origin:220px 340px}
@keyframes wag{50%{transform:rotate(14deg)}}
</style><g class="bob"><g class="rise" opacity=".8"><circle cx="60" cy="200" r="8" fill="none" stroke="#7fd8ff" stroke-width="4"/><circle cx="82" cy="240" r="6" fill="none" stroke="#7fd8ff" stroke-width="4"/><circle cx="52" cy="260" r="5" fill="none" stroke="#7fd8ff" stroke-width="4"/></g><rect x="124" y="340" width="30" height="80" rx="15" fill="#2a6f4e" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="166" y="340" width="30" height="80" rx="15" fill="#2a6f4e" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="120" y="400" width="38" height="22" rx="11" fill="#f2a900" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="162" y="400" width="38" height="22" rx="11" fill="#f2a900" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="76" y="238" width="30" height="86" rx="15" fill="#f6c99f" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" transform="rotate(18 91 245)"/><rect x="214" y="238" width="30" height="86" rx="15" fill="#f6c99f" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-8 229 245)"/><line x1="252" y1="150" x2="252" y2="330" stroke="#f2a900" stroke-width="9" stroke-linecap="round"/><path d="M232 176 Q232 140 252 130 Q272 140 272 176 M252 130 L252 176" fill="none" stroke="#f2a900" stroke-width="8" stroke-linecap="round"/><path d="M118 226 Q160 214 202 226 L208 320 Q160 340 112 320 Z" fill="#f2c14e" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M126 240 Q136 250 146 240 Q156 250 166 240 Q176 250 186 240 M126 268 Q136 278 146 268 Q156 278 166 268 Q176 278 186 268 M126 296 Q136 306 146 296 Q156 306 166 296 Q176 306 186 296" fill="none" stroke="#c9962e" stroke-width="4"/><path d="M72 210 Q56 96 160 68 Q264 96 248 210 Q240 258 216 274 Q230 204 222 164 L98 164 Q90 204 104 274 Q80 258 72 210 Z" fill="#f2c14e" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="160" cy="136" r="70" fill="#f6c99f" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="136" cy="132" r="8" fill="#1a1a1a"/><circle cx="184" cy="132" r="8" fill="#1a1a1a"/><path d="M126 172 Q138 164 150 170 Q160 178 170 170 Q182 164 194 172 Q188 196 160 198 Q132 196 126 172 Z" fill="#e0a93e" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g></svg>