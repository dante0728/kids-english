<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ABC 樂園 — 小朋友學英文</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="topbar">
  <div id="topLeft">
    <button class="round-btn" id="homeBtn">🏠</button>
    <button class="round-btn" id="backBtn" style="display:none">↩️</button>
  </div>
  <div id="topRight">
    <button class="round-btn" id="parentBtn" title="家長模式">⚙️</button>
    <button class="round-btn" id="bgmBtn" title="背景音樂">🎵</button>
    <div id="stars">⭐ <span id="starCount">0</span></div>
  </div>
</div>

<!-- 主題選單 -->
<div class="screen active" id="screen-menu">
  <h1>🌈 ABC 樂園 🌈</h1>
  <div class="subtitle">選一個主題開始冒險吧！</div>
  <div class="menu-grid" id="themeGrid"></div>
</div>

<!-- 模式選單 -->
<div class="screen" id="screen-mode">
  <h1 id="modeTitle"></h1>
  <div class="subtitle">要玩哪一種遊戲呢？</div>
  <div class="mode-grid">
    <div class="menu-card" style="--c:#4ecdc4" id="modeCards">
      <span class="emoji">🃏</span><span class="name">點點聽單字</span>
      <div class="count">點卡片聽單字和例句</div>
    </div>
    <div class="menu-card" style="--c:#ffb703" id="modeListen">
      <span class="emoji">👂</span><span class="name">聽聽看找一找</span>
      <div class="count">答對 5 題就過關！</div>
    </div>
    <div class="menu-card" style="--c:#ff6b9d" id="modeSpeak">
      <span class="emoji">🎤</span><span class="name">跟著唸唸看</span>
      <div class="count">大聲唸出英文</div>
    </div>
    <div class="menu-card" style="--c:#845ec2" id="modeBattle">
      <span class="emoji">⚔️</span><span class="name">英雄打怪獸</span>
      <div class="count">答對就攻擊怪獸！</div>
    </div>
  </div>
</div>

<!-- 英雄商店 -->
<div class="screen" id="screen-shop">
  <h1>🛒 英雄商店</h1>
  <div class="subtitle">用星星解鎖英雄，點已擁有的英雄出戰！</div>
  <div id="shopGrid"></div>
</div>

<!-- 遊戲四：英雄打怪獸 -->
<div class="screen" id="screen-battle">
  <h1>⚔️ 英雄打怪獸</h1>
  <div id="battleStage">
    <div id="heroBox"><img id="heroImg" src="" alt="hero"></div>
    <div id="battleFx"></div>
    <div id="monsterBox">
      <div id="monsterHp"></div>
      <div id="monsterFace">👾</div>
    </div>
  </div>
  <button id="battleSpeaker">🔊</button>
  <div class="choice-grid" id="battleChoices"></div>
</div>

<!-- 家長模式 -->
<div class="screen" id="screen-parent">
  <h1>⚙️ 家長模式</h1>
  <div class="subtitle">新增單字、更換圖片、錄製聲音（存在這台裝置）</div>
  <div style="text-align:center;margin-bottom:12px">
    <button class="small-btn" id="reportBtn">📊 學習報告</button>
  </div>
  <div id="parentReport" style="display:none"></div>
  <div id="parentThemes"></div>
  <div id="parentAdd"></div>
  <div id="parentList"></div>
  <div id="parentTools">
    <button class="small-btn" id="exportBtn">匯出備份 ⬇️</button>
    <label class="small-btn pink" style="display:inline-block">匯入備份 ⬆️<input type="file" id="importFile" accept=".json" hidden></label>
  </div>
</div>

<!-- 遊戲一：點點聽 -->
<div class="screen" id="screen-cards">
  <h1 id="cardsTitle">🃏 點點聽</h1>
  <div class="subtitle">點卡片，聽單字和例句！</div>
  <div class="card-grid" id="cardGrid"></div>
</div>

<!-- 遊戲二：聽力選圖 -->
<div class="screen" id="screen-listen">
  <h1>👂 聽聽看</h1>
  <div class="subtitle">聽聲音，找出正確的圖！</div>
  <div id="listenProgress"></div>
  <button id="bigSpeaker">🔊</button>
  <div class="choice-grid" id="choiceGrid"></div>
</div>

<!-- 遊戲三：跟著唸 -->
<div class="screen" id="screen-speak">
  <h1>🎤 跟著唸</h1>
  <div class="subtitle">聽一次，然後大聲唸出來！</div>
  <div id="speakTarget"></div>
  <button id="micBtn">🎤</button>
  <div id="speakResult"></div>
  <div id="speakBtns">
    <button class="small-btn" id="replayBtn">再聽一次 🔊</button>
    <button class="small-btn pink" id="selfOkBtn" style="display:none">我唸對了 ✋</button>
    <button class="small-btn" id="nextWordBtn">換一個 ▶</button>
  </div>
  <div id="noMicNote"></div>
</div>

<!-- 例句字幕 -->
<div id="sentenceBox"><div class="sen-en"></div><div class="sen-zh"></div></div>

<!-- PIN 碼閘門 -->
<div id="pinGate">
  <div id="pinCard">
    <div id="pinTitle">🔒 請輸入通關密碼</div>
    <div id="pinDots">○○○○</div>
    <div id="pinPad"></div>
  </div>
</div>

<!-- 打怪獸勝利畫面 -->
<div id="battleWin">
  <div class="big">🏆⚔️</div>
  <div class="msg">怪獸被打敗了！英雄獲勝！</div>
  <button class="small-btn pink" id="battleAgainBtn">再打一隻 ▶</button>
</div>

<!-- 過關畫面 -->
<div id="levelClear">
  <div class="big">🏆🎉</div>
  <div class="msg" id="clearMsg">過關了！你好棒！</div>
  <button class="small-btn pink" id="clearNextBtn">繼續玩 ▶</button>
</div>

<div id="confetti"></div>

<script src="js/words.js"></script>
<script src="js/audio.js"></script>
<script src="js/app.js"></script>
</body>
</html>
